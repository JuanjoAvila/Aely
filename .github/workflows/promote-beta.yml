name: Promocionar beta a producción

# La otra mitad del flujo de pruebas: cuando la beta ya está probada EN EL MÓVIL y aprobada desde
# Ajustes → Dev → Pruebas → Revisar esta beta, esto la sube a producción.
#
# Se lanza A MANO (Actions → este workflow → «Run workflow») a propósito: subir algo a producción
# es lo que ven el padre y la pareja, y no debe poder dispararlo nada automático. Mergea `beta` en
# `main` y **arranca el deploy de Pages a mano** (ver el paso del final: el push de aquí no lo
# dispara solo), y no se da por bueno hasta comprobar que producción sirve la versión nueva.
#
# ¿Por qué no lo lanza la app directamente? Haría falta guardar un token de GitHub con permiso de
# escritura sobre el repo en Supabase, y eso es una credencial nueva y jugosa a cambio de ahorrar
# un clic. No compensa (misma lógica que AGENTS.md §9 sobre secretos).

on:
  workflow_dispatch:
    inputs:
      confirmar:
        description: 'Escribe SUBIR para confirmar (la verá tu padre y tu pareja)'
        required: true
        default: ''
      tandas:
        description: 'Qué tandas subir, separadas por comas (p. ej. import,gestos). Vacío = la beta entera.'
        required: false
        default: ''
      commits:
        description: 'O, para un parche urgente: commits sueltos de beta a subir (hash cortos, separados por comas, del más antiguo al más nuevo). No se puede usar a la vez que «tandas».'
        required: false
        default: ''
      version:
        description: 'Solo con «commits»: número de la versión del parche (p. ej. 4.12.2). Vacío = sube el PATCH de lo que hay en producción ahora.'
        required: false
        default: ''

permissions:
  contents: write
  # `actions: write` hace falta para el `gh workflow run deploy.yml` del final: sin él la API
  # responde 403 «Resource not accessible by integration» y la promoción se queda con `main` ya
  # mergeado pero producción sirviendo lo viejo (pasó el 2026-07-28 subiendo la 4.12.1).
  actions: write

concurrency:
  group: promote-beta
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Comprobar la confirmación
        if: ${{ inputs.confirmar != 'SUBIR' }}
        run: |
          echo "::error::Hay que escribir SUBIR para confirmar. No se ha tocado nada."
          exit 1

      - name: «tandas» y «commits» no van a la vez
        if: ${{ inputs.tandas != '' && inputs.commits != '' }}
        run: |
          echo "::error::Elige UNA vía: «tandas» (mergea ramas tanda/<id>) o «commits» (cherry-pick suelto). No las dos."
          exit 1

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ¿Hay algo que subir?
        run: |
          git fetch origin main beta
          if [ -z "$(git log origin/main..origin/beta --oneline)" ]; then
            # Comillas SIMPLES a propósito: dentro de comillas dobles los acentos graves son
            # sustitución de comandos, así que «`beta`» intentaba EJECUTAR `beta` y el mensaje
            # llegaba mutilado justo el día que hacía falta leerlo (venía así desde el 24/7).
            echo '::error::la rama beta no tiene nada que main no tenga ya. Nada que promocionar.'
            exit 1
          fi
          echo "### Se va a subir a producción" >> $GITHUB_STEP_SUMMARY
          git log origin/main..origin/beta --oneline >> $GITHUB_STEP_SUMMARY

      # Los mismos tests que el deploy: que una beta esté probada a mano no exime de la suite.
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # ⚠ `git checkout beta` A SECAS NO VALE: la release rodante de pruebas crea un **tag**
      # llamado `beta`, así que el nombre es ambiguo y git se queda con el TAG. Esto estuvo
      # ejecutando los tests contra un árbol de hace semanas (detectado el 2026-07-28: la
      # promoción fallaba por una prueba que ya estaba arreglada en la rama). O sea que la red de
      # seguridad no miraba lo que se iba a publicar. `-B ... origin/beta` es inequívoco.
      - name: Tests
        run: |
          git checkout -B beta origin/beta
          git log -1 --oneline
          # docs-frescura mira la rama chequeada; el workflow_dispatch nace en `main` y si no
          # forzamos esto, GITHUB_REF_NAME=main exige un bump absurdo de toda la ronda beta.
          echo "GITHUB_REF_NAME=beta" >> "$GITHUB_ENV"
          npm ci
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list || true
          npx playwright install chromium --with-deps
          node scripts/run-tests.mjs

      # 2026-08-17: `d7fac794` (APK 41) se hizo en `main` y no volvió a `beta`. Un promote vacío
      # hace `merge -X theirs origin/beta` y habría pintado apk.json 40 / 4.16.2 encima de la 41
      # que ya tiene la familia (el «apk.json fantasma» de 4.9.2, al revés: bajar en vez de
      # publicar un APK que no existe). Esto PARA antes de tocar `main`.
      - name: No bajar el APK ni VERSION de la familia
        if: ${{ inputs.commits == '' }}
        run: |
          git fetch origin main beta
          main_code=$(git show origin/main:android/app/build.gradle | grep -m1 'versionCode' | grep -oE '[0-9]+')
          beta_code=$(git show origin/beta:android/app/build.gradle | grep -m1 'versionCode' | grep -oE '[0-9]+')
          main_ver=$(git show origin/main:VERSION | tr -d '[:space:]')
          beta_ver=$(git show origin/beta:VERSION | tr -d '[:space:]')
          echo "APK versionCode  main=$main_code  beta=$beta_code"
          echo "VERSION          main=$main_ver  beta=$beta_ver"
          if [ -z "$main_code" ] || [ -z "$beta_code" ]; then
            echo "::error::no pude leer versionCode de build.gradle"
            exit 1
          fi
          if [ "$beta_code" -lt "$main_code" ]; then
            echo "::error::beta APK versionCode $beta_code < main $main_code. Un promote vacío bajaría el APK. Alinea public/apk.json y android/app/build.gradle en beta al de main."
            exit 1
          fi
          if [ "$beta_ver" != "$main_ver" ]; then
            lowest=$(printf '%s\n%s\n' "$beta_ver" "$main_ver" | sort -V | head -1)
            if [ "$lowest" = "$beta_ver" ]; then
              echo "::error::VERSION de beta ($beta_ver) es menor que main ($main_ver). El promote bajaría la versión de Pages."
              exit 1
            fi
          fi

      # SUBIR SOLO LAS TANDAS APROBADAS (petición suya 2026-07-29: «que se pudieran implementar
      # varias betas a la vez y que me des la opción de aprobarlas por separado»).
      #
      # Con `tandas` vacío se sube `beta` entera, que es como ha funcionado siempre y sigue siendo
      # lo normal cuando solo hay una cosa en vuelo.
      #
      # Con tandas, cada una vive en su rama `tanda/<id>` y aquí se mergean SOLO las que él ha
      # aprobado en el panel. Eso es lo que permite que una tanda lista suba hoy sin esperar a la
      # que todavía tiene un fallo — que es el problema real que esto viene a resolver.
      #
      # ⚠ Si pides una tanda cuya rama no existe, esto PARA. Subir «lo que haya» cuando falta una
      # rama es exactamente el fallo silencioso que ya costó dos promociones a medias.
      #
      # ⚠⚠ Y LA RAMA HAY QUE CREARLA ANTES DE ESCRIBIR EL CÓDIGO, no después. Declarar tandas en
      # las notas NO crea ninguna rama: si las cuatro tandas se han commiteado mezcladas encima de
      # `beta` (le pasó a la 4.13.0), ya no hay forma limpia de separarlas y esa ronda solo puede
      # subir ENTERA. La regla completa, en docs/TESTING.md.
      # TERCERA VÍA: PARCHE POR COMMITS SUELTOS (petición suya 1/8: «se han implementado
      # montonazo de cosas y hay cosas urgentes para subir a prod por bugs gordos y no se puede
      # subir esos parches»). Las tandas necesitan haber nacido en su propia rama DESDE EL PRIMER
      # COMMIT — si una ronda entera se ha commiteado mezclada (como la 4.13.0), ya no hay forma
      # limpia de trocearla por tandas. Esto es la vía de emergencia: `cherry-pick` de los commits
      # exactos que quiere subir, sin tocar el resto de la rama. Sirve para EXACTAMENTE lo que
      # pasó hoy: cinco arreglos de bugs listos mientras el importador de hojas todavía no.
      #
      # No sube VERSION solo, porque los commits de `beta` llevan el sello de la ronda EN CURSO
      # (4.13.0), que no es lo que le toca a un parche sobre la 4.12.1 que ya está en producción.
      # Se calcula un PATCH nuevo sobre lo que hay en `main` ahora mismo (o el que él pida) y se
      # sella aparte, en un commit propio, después de los cherry-picks.
      - name: Mergear a main lo aprobado
        if: ${{ inputs.commits == '' }}
        env:
          # Por `env` y no interpolado dentro del script: `'${{ inputs.tandas }}'` mete el texto
          # que él escriba DENTRO de la comilla simple, así que un apóstrofo o un `$(…)` en la
          # casilla se convierte en shell ejecutable en un workflow con permiso de escritura.
          TANDAS_IN: ${{ inputs.tandas }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout main
          TANDAS="$(printf '%s' "$TANDAS_IN" | tr -d '[:space:]')"
          if [ -z "$TANDAS" ]; then
            # Preferir beta en conflictos: main a veces tiene cherry-picks parciales
            # (4.12.3/4.12.4) que chocan con la ronda entera (falló el promote 5/8).
            git merge --no-ff -X theirs origin/beta -m "Promocionar beta a producción (probada y aprobada en el móvil)"
          else
            echo "$TANDAS" | tr ',' '\n' | while read -r T; do
              [ -n "$T" ] || continue
              git rev-parse --verify "refs/remotes/origin/tanda/$T" >/dev/null 2>&1 || {
                echo "::error::no existe la rama tanda/$T · no se sube nada a medias."
                echo "::error::Ramas de tanda que SÍ existen: $(git branch -r --list 'origin/tanda/*' --format='%(refname:lstrip=4)' | tr '\n' ' ')"
                echo "::error::Si esta ronda se commiteó mezclada en beta, no se puede trocear: déjalo vacío y sube la beta entera."
                exit 1; }
            done
            for T in $(echo "$TANDAS" | tr ',' ' '); do
              [ -n "$T" ] || continue
              echo "→ tanda/$T"
              git merge --no-ff "origin/tanda/$T" -m "Promocionar tanda «$T» a producción (probada y aprobada en el móvil)"
            done
          fi
          git push origin main

      - name: Cherry-pick de commits sueltos (parche urgente)
        if: ${{ inputs.commits != '' }}
        env:
          COMMITS_IN: ${{ inputs.commits }}
          VERSION_IN: ${{ inputs.version }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout main
          BASE=$(cat VERSION | tr -d '[:space:]')

          # El número del parche: el que pida, o el PATCH de lo que ya hay en main +1. Si lo que
          # pide ya existe o es menor, PARA — bajarle la versión a la gente es peor que no subir.
          NUEVA="$(printf '%s' "$VERSION_IN" | tr -d '[:space:]')"
          if [ -z "$NUEVA" ]; then
            MAYOR=$(echo "$BASE" | cut -d. -f1); MENOR=$(echo "$BASE" | cut -d. -f2); PATCH=$(echo "$BASE" | cut -d. -f3)
            NUEVA="$MAYOR.$MENOR.$((PATCH + 1))"
          fi
          node -e "
            const a='$BASE'.split('.').map(Number), b='$NUEVA'.split('.').map(Number);
            if(b.length!==3||b.some(isNaN)) { console.error('«'+'$NUEVA'+'» no es X.Y.Z'); process.exit(1); }
            for(let i=0;i<3;i++){ if(b[i]>a[i]) process.exit(0); if(b[i]<a[i]){ console.error('$NUEVA'+' es MENOR que la '+'$BASE'+' ya publicada'); process.exit(1); } }
            console.error('$NUEVA'+' no es mayor que la '+'$BASE'+' ya publicada'); process.exit(1);
          " || { echo "::error::número de versión inválido, mira el mensaje de arriba"; exit 1; }
          echo "parche: $BASE → $NUEVA"

          echo "$COMMITS_IN" | tr ',' '\n' | while read -r C; do
            C="$(printf '%s' "$C" | tr -d '[:space:]')"
            [ -n "$C" ] || continue
            git rev-parse --verify "$C" >/dev/null 2>&1 || { echo "::error::«$C» no es un commit que exista en este árbol"; exit 1; }
          done

          echo "$COMMITS_IN" | tr ',' '\n' | while read -r C; do
            C="$(printf '%s' "$C" | tr -d '[:space:]')"
            [ -n "$C" ] || continue
            echo "→ cherry-pick $C ($(git log -1 --format=%s "$C"))"
            git cherry-pick -x "$C" || {
              echo "::error::«$C» no aplica limpio sobre main (conflicto). Resuélvelo en tu portátil:"
              echo "::error::  git checkout main && git cherry-pick -x $C   (y el resto de la lista a mano)"
              git cherry-pick --abort 2>/dev/null || true
              exit 1
            }
          done

          printf '%s' "$NUEVA" > VERSION
          git add VERSION
          git commit -m "release($NUEVA): parche urgente — commits sueltos de beta, sin esperar al resto de la ronda"
          git push origin main

      # ⚠ ESTE PASO NO SOBRA: un push hecho con el GITHUB_TOKEN del propio workflow **NO dispara
      # otros workflows** (protección de GitHub contra bucles infinitos). O sea que el `push` de
      # arriba NO arranca el deploy de Pages, y la promoción se quedaba a medias EN SILENCIO:
      # `main` con la versión nueva y producción sirviendo la vieja. Pasó la primera vez que esto
      # se usó de verdad (2026-07-26, promoción de la 4.11.0): los tres runs en verde y Pages
      # todavía en la 4.10.2. Un `workflow_dispatch` por API sí arranca, aun con el mismo token.
      - name: Arrancar el deploy de Pages (el push no lo hace)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main

      # Y no nos fiamos de que haya arrancado: se comprueba que producción sirve de verdad la
      # versión nueva. Una promoción que no llega a Pages no es una promoción.
      - name: Comprobar que producción ya sirve la versión nueva
        run: |
          # La versión que tiene que servir Pages es la de LO QUE SE ACABA DE SUBIR, no la de
          # `beta`: promocionando por tandas, `beta` puede ir por delante de lo aprobado.
          VERSION=$(git show main:VERSION | tr -d '[:space:]')
          echo "Esperando a que Pages sirva $VERSION…"
          LIVE=""
          for i in $(seq 1 40); do
            LIVE=$(curl -sL "https://juanjoavila.github.io/Mi-Cartera/version.json" | sed -n 's/.*"version":"\([^"]*\)".*/\1/p')
            if [ "$LIVE" = "$VERSION" ]; then
              echo "✅ Producción sirve $LIVE" >> $GITHUB_STEP_SUMMARY
              exit 0
            fi
            sleep 15
          done
          echo "::error::Pages sigue sirviendo «$LIVE» y esperábamos «$VERSION». Mira el run de «Deploy a GitHub Pages»."
          exit 1

      - name: Resumen
        run: |
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Subido a \`main\` y publicado. La app se lo ofrece sola a todo el mundo." >> $GITHUB_STEP_SUMMARY
