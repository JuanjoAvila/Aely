name: Deploy Supabase

# Supabase es compartido por ambos canales: integrar fuentes no autoriza activarlas.
# Despliegue manual de una sola función; migraciones solo con selección explícita.
on:
  workflow_dispatch:
    inputs:
      funcion:
        description: "Una sola función autorizada (p.ej. ingest)."
        required: true
        type: string
        default: ""
      migraciones:
        description: "Aplicar TAMBIÉN las migraciones de la base de datos"
        required: false
        default: "no"
        type: choice
        options: ["no", "si"]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Se valida antes del gate y del SQL: una entrada inválida nunca debe tocar la BD.
      - name: Validar función
        env:
          FN: ${{ inputs.funcion }}
        shell: bash
        run: |
          if [[ ! "$FN" =~ ^[a-z][a-z-]*$ ]] || [ ! -f "supabase/functions/$FN/index.ts" ]; then
            echo "Función no válida"; exit 1
          fi

      # Si aún no has configurado el token, salta el deploy sin marcar el job en rojo.
      - name: Comprobar configuración
        id: gate
        env:
          TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          REF: ${{ vars.SUPABASE_PROJECT_REF }}
          DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          MIGRACIONES: ${{ inputs.migraciones }}
        shell: bash
        run: |
          if [ -z "$TOKEN" ] || [ -z "$REF" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Falta SUPABASE_ACCESS_TOKEN (secret) o SUPABASE_PROJECT_REF (variable). Salto el deploy; configúralos en Settings del repo."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
          # El registro histórico diverge: las migraciones se piden a propósito.
          MIG_OK=false
          if [ "$MIGRACIONES" = "si" ]; then MIG_OK=true; fi
          if [ -n "$DB_PASSWORD" ] && [ "$MIG_OK" = "true" ]; then echo "migrate=true" >> "$GITHUB_OUTPUT"; else echo "migrate=false" >> "$GITHUB_OUTPUT"; fi

      - name: Instalar Supabase CLI
        if: steps.gate.outputs.skip != 'true'
        uses: supabase/setup-cli@v1
        with:
          version: latest

      # Requiere migraciones=si y contraseña. --include-all conserva la ruta histórica;
      # el registro remoto puede diferir del repo: revisar el SQL antes de autorizarlo.
      # continue-on-error permite seguir con la función; verde no acredita éxito del SQL.
      - name: Aplicar migraciones
        if: steps.gate.outputs.skip != 'true' && steps.gate.outputs.migrate == 'true'
        continue-on-error: true
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          supabase link --project-ref "${{ vars.SUPABASE_PROJECT_REF }}" --password "$DB_PASSWORD"
          supabase db push --include-all --password "$DB_PASSWORD"

      - name: Desplegar Edge Functions
        if: steps.gate.outputs.skip != 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          FN: ${{ inputs.funcion }}
        shell: bash
        run: |
          # Una única función evita activar otras que aún no están publicadas.
          echo "Desplegando SOLO $FN"
          supabase functions deploy "$FN" --project-ref "${{ vars.SUPABASE_PROJECT_REF }}"
