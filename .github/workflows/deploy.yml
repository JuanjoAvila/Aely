name: Deploy a GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: {}   # permite lanzarlo a mano desde la pestaña Actions

# Permisos mínimos para publicar en Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Un despliegue a la vez; no canceles el que esté en curso
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x
      - name: Tests + privacidad
        run: |
          npm ci
          # Borrar SOLO el .list no basta: la imagen del runner trae la fuente tambien en
          # formato deb822 (.sources). Se quita cualquier fuente que apunte a dl.google.com.
          sudo rm -f /etc/apt/sources.list.d/google*.list /etc/apt/sources.list.d/google*.sources || true
          sudo grep -rl "dl.google.com" /etc/apt/sources.list /etc/apt/sources.list.d/ 2>/dev/null | xargs -r sudo rm -f || true
          npx playwright install chromium --with-deps
          node scripts/run-tests.mjs
          node scripts/guard-privacy.mjs

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20

      - name: Ensamblar index.html desde src/
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: node scripts/build-app.mjs

      - name: Sellar versión del Service Worker
        run: node scripts/stamp-version.mjs

      # Minifica los <script>/<style> inline de public/index.html (solo whitespace+syntax,
      # sin renombrar símbolos). La fuente editable sigue siendo el index.html del repo.
      - name: Minificar index.html
        run: |
          npm install --no-save --no-audit --no-fund esbuild@0.25.5
          node scripts/minify-html.mjs

      # CSP sin 'unsafe-inline' (SEG-07): la huella de cada <script> inline en script-src. Tiene
      # que ser lo ÚLTIMO que toca index.html: un byte cambiado después y la app no arranca.
      # El propio script comprueba el resultado y corta el despliegue si no cuadra.
      - name: Sellar la CSP con las huellas de los scripts
        run: node scripts/csp-sellar.mjs

      # Bundle OTA para la app Android (capgo/capacitor-updater self-hosted):
      # zip de public/ (ya sellado+minificado) + version.json con la versión.
      # La app lo consulta al arrancar y hot-swapea el bundle en el siguiente arranque.
      # `checksum` (SEG-01): SHA-256 del zip. El plugin lo recalcula al bajarlo y tira el bundle
      # si no casa (zip truncado o el viejo aún en la caché de Pages). Va DESPUÉS de mover el zip
      # y ANTES de nada más: si algo tocara el zip después, ningún móvil se actualizaría.
      # `signature`: ese mismo SHA-256 firmado con la clave del OTA, solo si existe el secreto
      # (`scripts/ota-manifiesto.mjs`). El `checksum` en claro se queda para las APK sin clave.
      - name: Empaquetar bundle OTA (bundle.zip + version.json)
        env:
          OTA_SIGNING_KEY: ${{ secrets.OTA_SIGNING_KEY }}
        run: |
          VERSION=$(cat VERSION | tr -d '[:space:]')
          (cd public && zip -qr ../bundle.zip .)
          mv bundle.zip public/bundle.zip
          node scripts/ota-manifiesto.mjs --zip public/bundle.zip --out public/version.json --version "$VERSION" --url "https://juanjoavila.github.io/Aely/bundle.zip"
          echo "OTA $VERSION → $(du -h public/bundle.zip | cut -f1)"

      - name: Configurar Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - name: Subir artefacto (carpeta public)
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Desplegar a GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
