name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      focal_spec:
        description: "Spec e2e opcional, ejecutado además de la suite completa"
        required: false
        default: ""
        type: string
      tr_pair_review:
        description: "Ejecutar además contratos, DOM y CPU6 del emparejado TR"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependencias
        run: npm ci

      - name: Instalar Chromium (Playwright)
        run: |
          # El repo de Google Chrome sirve a veces un indice apt con el hash cambiado y tumba
          # `--with-deps` (9/9/2026: dos runs seguidos de la beta). No usamos Chrome, solo el
          # Chromium que trae Playwright, asi que se quita esa fuente antes de instalar. No se
          # relaja nada: los deps siguen instalandose con --with-deps.
          # Borrar SOLO el .list no basta: la imagen del runner trae la fuente tambien en
          # formato deb822 (.sources). Se quita cualquier fuente que apunte a dl.google.com.
          sudo rm -f /etc/apt/sources.list.d/google*.list /etc/apt/sources.list.d/google*.sources || true
          sudo grep -rl "dl.google.com" /etc/apt/sources.list /etc/apt/sources.list.d/ 2>/dev/null | xargs -r sudo rm -f || true
          npx playwright install chromium --with-deps

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Tests (build + unit + Deno + E2E)
        run: node scripts/run-tests.mjs

      - name: Privacidad
        run: node scripts/guard-privacy.mjs

  # Un gate de catálogo/versión puede impedir llegar al navegador en la suite completa.
  # Esta prueba manual acredita su spec y EXIT por separado; el job test conserva TODOS sus gates.
  focal-e2e:
    if: github.event_name == 'workflow_dispatch' && inputs.focal_spec != ''
    runs-on: ubuntu-latest
    env:
      FOCAL_SPEC: ${{ inputs.focal_spec }}
      MC_E2E_REPORT: test-results/focal-report.json
      MC_E2E_OUTPUT_DIR: test-results/focal-output
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: Instalar Chromium
        run: |
          sudo rm -f /etc/apt/sources.list.d/google*.list /etc/apt/sources.list.d/google*.sources || true
          sudo grep -rl "dl.google.com" /etc/apt/sources.list /etc/apt/sources.list.d/ 2>/dev/null | xargs -r sudo rm -f || true
          npx playwright install chromium --with-deps
      - name: Verificar spec y ensamblar
        run: |
          node -e 'const fs=require("fs");const p=process.env.FOCAL_SPEC;if(!/^e2e\/[a-z0-9-]+\.spec\.mjs$/.test(p)||!fs.existsSync(p))throw Error("Spec no permitido");'
          node scripts/build-app.mjs
      - name: E2E focal con un worker y cero retries
        run: node node_modules/@playwright/test/cli.js test "$FOCAL_SPEC" --project=chromium --workers=1 --retries=0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: focal-e2e-report
          path: |
            test-results/focal-report.json
            test-results/focal-output


  tr-pair-review:
    if: ${{ inputs.tr_pair_review }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: Fuente exacta y build
        run: |
          git rev-parse HEAD
          git fetch origin 2ff4c59ed6cd0a3c436efda2f2c0a7fc40925fdb
          npm run build
          npm run test:syntax
      - name: Contratos y migracion
        id: contracts
        continue-on-error: true
        run: |
          mkdir -p test-results/tr-review
          set -o pipefail
          node tests/tr-emparejado-automatico.test.mjs | tee test-results/tr-review/automatico.log
          node tests/tr-emparejado-revision.test.mjs | tee test-results/tr-review/revision.log
          node tests/ob-iguales-ordinal.test.mjs | tee test-results/tr-review/ordinal.log
          node tests/recibo-invariante.test.mjs | tee test-results/tr-review/recibo-invariante.log
          node tests/recibo-domiciliado-sin-acreditar.test.mjs
          node tests/pull-historico-entero.test.mjs
          node tests/merge-expenses-cloud.test.mjs
          node tests/i18n-keys.test.mjs
          node tests/relevant-tests.test.mjs
      - name: Chromium remoto
        run: |
          sudo rm -f /etc/apt/sources.list.d/google*.list /etc/apt/sources.list.d/google*.sources || true
          npx playwright install chromium --with-deps
      - name: Sync y pull reales en navegador sintetico
        id: dom
        continue-on-error: true
        env:
          MC_E2E_REPORT: test-results/tr-review/dom.json
          MC_E2E_OUTPUT_DIR: test-results/tr-dom
        run: npx playwright test e2e/tr-emparejado-automatico.spec.mjs e2e/tr-iguales-ordinal.spec.mjs --workers=1 --retries=0
      - name: Comparacion CPU6
        id: perf
        continue-on-error: true
        env:
          MC_E2E_REPORT: test-results/tr-review/cpu6.json
          MC_E2E_OUTPUT_DIR: test-results/tr-perf
        run: npx playwright test e2e/tr-emparejado-rendimiento.spec.mjs --workers=1 --retries=0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tr-pair-review
          path: test-results/
      - name: Resultado conjunto
        if: always()
        env:
          CONTRACTS: ${{ steps.contracts.outcome }}
          DOM: ${{ steps.dom.outcome }}
          PERF: ${{ steps.perf.outcome }}
        run: test "$CONTRACTS" = success && test "$DOM" = success && test "$PERF" = success
