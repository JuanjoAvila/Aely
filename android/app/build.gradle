apply plugin: 'com.android.application'

// URL de ingest (con su token) desde local.properties â€” NUNCA al repo (es pÃºblico).
// Clave: MICARTERA_INGEST_URL=https://<proyecto>.supabase.co/functions/v1/ingest?token=<INGEST_TOKEN>
def localProps = new Properties()
def localPropsFile = rootProject.file('local.properties')
if (localPropsFile.exists()) {
    localPropsFile.withInputStream { localProps.load(it) }
}
def ingestUrl = localProps.getProperty('MICARTERA_INGEST_URL', '')
// InspecciÃ³n de la WebView (chrome://inspect / CDP por adb). Se enciende SOLO poniendo
// MICARTERA_WEBDEBUG=1 en local.properties, que no va al repo: asÃ­ una APK compilada aquÃ­ para
// depurar en su mÃ³vil se puede mirar por dentro, y la que publica el CI nunca lleva el socket
// abierto. Ver docs/LAG-DESLIZAR.md Â§0 â€” sin esto no hay forma de medir el lag donde ocurre.
// âš  2026-08-06: WEBDEBUG=1 en assembleRelease metiÃ³ el socket de depuraciÃ³n en la APK real
// (barra/chrome raro bajo la cÃ¡mara + riesgo). GuardiÃ¡n abajo: assembleRelease FALLA si
// WEBDEBUG=1, salvo MICARTERA_ALLOW_WEBDEBUG_RELEASE=1 (solo para CDP a propÃ³sito).
// Para publicar: `npm run release:apk` (exige WEB_DEBUG off y no admite el bypass).
def webDebug = localProps.getProperty('MICARTERA_WEBDEBUG', '0') == '1'
def allowWebDebugRelease = localProps.getProperty('MICARTERA_ALLOW_WEBDEBUG_RELEASE', '0') == '1'

android {
    namespace "com.micartera.app"
    compileSdk rootProject.ext.compileSdkVersion
    buildFeatures {
        buildConfig true
    }
    defaultConfig {
        applicationId "com.micartera.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        /* 45: prod ya anuncia 45 (APK Aely 4.18.22). Beta estaba en 44; sin esto el promote ofrece APK mas vieja. */
        versionCode 45
        versionName "4.18.22"
        buildConfigField "String", "INGEST_URL", "\"${ingestUrl}\""
        buildConfigField "boolean", "WEB_DEBUG", "${webDebug}"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // Firma release desde local.properties (keystore en C:/Users/<tu>/.micartera, NUNCA en el repo).
    // Claves: MICARTERA_KS_FILE / MICARTERA_KS_PASS / MICARTERA_KEY_ALIAS / MICARTERA_KEY_PASS.
    // Sin ellas, assembleRelease genera un APK sin firmar (como antes).
    def ksFile = localProps.getProperty('MICARTERA_KS_FILE', '')
    signingConfigs {
        release {
            if (ksFile) {
                storeFile file(ksFile)
                storePassword localProps.getProperty('MICARTERA_KS_PASS', '')
                keyAlias localProps.getProperty('MICARTERA_KEY_ALIAS', 'micartera')
                keyPassword localProps.getProperty('MICARTERA_KEY_PASS', '')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (ksFile) {
                signingConfig signingConfigs.release
            }
        }
        /* Â«SOLO PARA MÃ, EN BETAÂ» â€” una APK de pruebas instalable EN PARALELO a la real
           (2026-08-01: pidiÃ³ una vÃ­a para probar cambios nativos sin esperar a la release
           pÃºblica). Sin `applicationIdSuffix` esto habrÃ­a sido `com.micartera.app` a secas â€”
           el MISMO id que la app de producciÃ³n, firmada con OTRA llave (la de debug de Android,
           auto-generada) â€” asÃ­ que instalarla habrÃ­a exigido DESINSTALAR la real primero
           (Android rechaza una actualizaciÃ³n con firma distinta al mismo id). Con el sufijo,
           Android la trata como una app aparte: las dos conviven en el mÃ³vil, cada una con sus
           propios datos. `.debug` en el nombre visible para que no se confunda con la de
           siempre en la lista de apps. */
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation "androidx.biometric:biometric:1.1.0"   // huella/candado (plugin MiCartera)
    // work-runtime + guava: ListenableFuture vive en guava; el stub 9999 no basta para compilar el Worker.
    implementation "androidx.work:work-runtime:2.9.1"
    implementation "com.google.guava:guava:33.6.0-android"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

/* GuardiÃ¡n WEB_DEBUG (2026-08-06): no se puede sacar una release Â«de depuraciÃ³nÂ» sin querer.
   MICARTERA_ALLOW_WEBDEBUG_RELEASE=1 solo para CDP/lag a propÃ³sito (docs/LAG-DESLIZAR.md).
   `npm run release:apk` NO usa ese bypass: aborta antes si WEBDEBUG=1. */
gradle.taskGraph.whenReady { graph ->
    def releasing = graph.allTasks.any { it.name == 'assembleRelease' || it.name == 'bundleRelease' }
    if (releasing && webDebug && !allowWebDebugRelease) {
        throw new GradleException(
            "MICARTERA_WEBDEBUG=1 bloquea assembleRelease (incidente 2026-08-06: APK real con socket abierto).\n" +
            "  â†’ Para publicar: deja MICARTERA_WEBDEBUG=0 (o borra la clave) y usa npm run release:apk.\n" +
            "  â†’ Para depurar WebView a propÃ³sito: MICARTERA_ALLOW_WEBDEBUG_RELEASE=1 en local.properties\n" +
            "    (esa APK NO se sube a GitHub Releases)."
        )
    }
}

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
