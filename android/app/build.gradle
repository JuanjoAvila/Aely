apply plugin: 'com.android.application'

// URL de ingest (con su token) desde local.properties — NUNCA al repo (es público).
// Clave: MICARTERA_INGEST_URL=https://<proyecto>.supabase.co/functions/v1/ingest?token=<INGEST_TOKEN>
def localProps = new Properties()
def localPropsFile = rootProject.file('local.properties')
if (localPropsFile.exists()) {
    localPropsFile.withInputStream { localProps.load(it) }
}
def ingestUrl = localProps.getProperty('MICARTERA_INGEST_URL', '')
// Inspección de la WebView (chrome://inspect / CDP por adb). Se enciende SOLO poniendo
// MICARTERA_WEBDEBUG=1 en local.properties, que no va al repo: así una APK compilada aquí para
// depurar en su móvil se puede mirar por dentro, y la que publica el CI nunca lleva el socket
// abierto. Ver docs/LAG-DESLIZAR.md §0 — sin esto no hay forma de medir el lag donde ocurre.
// ⚠ 2026-08-06: WEBDEBUG=1 en assembleRelease metió el socket de depuración en la APK real
// (barra/chrome raro bajo la cámara + riesgo). Guardián abajo: assembleRelease FALLA si
// WEBDEBUG=1, salvo MICARTERA_ALLOW_WEBDEBUG_RELEASE=1 (solo para CDP a propósito).
// Para publicar: `npm run release:apk` (exige WEB_DEBUG off y no admite el bypass).
def webDebug = localProps.getProperty('MICARTERA_WEBDEBUG', '0') == '1'
def allowWebDebugRelease = localProps.getProperty('MICARTERA_ALLOW_WEBDEBUG_RELEASE', '0') == '1'

android {
    namespace "com.micartera.app"
    compileSdk rootProject.ext.compileSdkVersion
    buildFeatures {
        buildConfig true
    }
    defaultConfig {
        applicationId "com.micartera.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        /* ⚠ 45, NO 43. Produccion anuncia la 42, pero SU movil lleva la 44 (la APK de beta con el
           icono arreglado). Android no ofrece una actualizacion con codigo menor o igual al
           instalado, asi que con 43 o 44 el no veria nunca esta. 45 le llega a los tres. */
        versionCode 45
        versionName "4.18.22"
        /* ⚠ INGEST_URL VACÍA POR DEFECTO — solo la APK `.debug` la lleva (14/9/2026, OPS-06).
           Estaba aquí, en defaultConfig, así que valía TAMBIÉN para release: la APK que publica
           `release:apk` en un repo PÚBLICO llevaba dentro la URL de ingest con el token del dueño.
           Cualquiera con la APK podía sacarla y apuntar gastos en su cuenta, y un móvil de la
           familia sin token propio le mandaba SUS gastos de TR a él (fallback de TrExpenseListener).
           Ahora release siempre sale con "" (ver buildTypes) y cada persona usa su token propio. */
        buildConfigField "String", "INGEST_URL", "\"\""
        buildConfigField "boolean", "WEB_DEBUG", "${webDebug}"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // Firma release desde local.properties (keystore en C:/Users/<tu>/.micartera, NUNCA en el repo).
    // Claves: MICARTERA_KS_FILE / MICARTERA_KS_PASS / MICARTERA_KEY_ALIAS / MICARTERA_KEY_PASS.
    // Sin ellas, assembleRelease genera un APK sin firmar (como antes).
    def ksFile = localProps.getProperty('MICARTERA_KS_FILE', '')
    signingConfigs {
        release {
            if (ksFile) {
                storeFile file(ksFile)
                storePassword localProps.getProperty('MICARTERA_KS_PASS', '')
                keyAlias localProps.getProperty('MICARTERA_KEY_ALIAS', 'micartera')
                keyPassword localProps.getProperty('MICARTERA_KEY_PASS', '')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (ksFile) {
                signingConfig signingConfigs.release
            }
        }
        /* «SOLO PARA MÍ, EN BETA» — una APK de pruebas instalable EN PARALELO a la real
           (2026-08-01: pidió una vía para probar cambios nativos sin esperar a la release
           pública). Sin `applicationIdSuffix` esto habría sido `com.micartera.app` a secas —
           el MISMO id que la app de producción, firmada con OTRA llave (la de debug de Android,
           auto-generada) — así que instalarla habría exigido DESINSTALAR la real primero
           (Android rechaza una actualización con firma distinta al mismo id). Con el sufijo,
           Android la trata como una app aparte: las dos conviven en el móvil, cada una con sus
           propios datos. `.debug` en el nombre visible para que no se confunda con la de
           siempre en la lista de apps. */
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
            // Solo la de pruebas del dueño, que nunca se publica, puede llevar su URL de ingest.
            buildConfigField "String", "INGEST_URL", "\"${ingestUrl}\""
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation "androidx.biometric:biometric:1.1.0"   // huella/candado (plugin MiCartera)
    // work-runtime + guava: ListenableFuture vive en guava; el stub 9999 no basta para compilar el Worker.
    implementation "androidx.work:work-runtime:2.9.1"
    implementation "com.google.guava:guava:33.6.0-android"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

/* Guardián WEB_DEBUG (2026-08-06): no se puede sacar una release «de depuración» sin querer.
   MICARTERA_ALLOW_WEBDEBUG_RELEASE=1 solo para CDP/lag a propósito (docs/LAG-DESLIZAR.md).
   `npm run release:apk` NO usa ese bypass: aborta antes si WEBDEBUG=1. */
gradle.taskGraph.whenReady { graph ->
    def releasing = graph.allTasks.any { it.name == 'assembleRelease' || it.name == 'bundleRelease' }
    if (releasing && webDebug && !allowWebDebugRelease) {
        throw new GradleException(
            "MICARTERA_WEBDEBUG=1 bloquea assembleRelease (incidente 2026-08-06: APK real con socket abierto).\n" +
            "  → Para publicar: deja MICARTERA_WEBDEBUG=0 (o borra la clave) y usa npm run release:apk.\n" +
            "  → Para depurar WebView a propósito: MICARTERA_ALLOW_WEBDEBUG_RELEASE=1 en local.properties\n" +
            "    (esa APK NO se sube a GitHub Releases)."
        )
    }
}

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
