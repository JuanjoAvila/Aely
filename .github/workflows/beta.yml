name: Publicar BETA (solo el móvil del dueño)

# Entorno de pruebas del creador (petición 2026-07-24): poder probar una versión EN EL MÓVIL antes
# de que le llegue al resto de la familia.
#
# Por qué NO va por GitHub Pages: Pages sirve UNA sola versión (la de `main`), que es justo la que
# usan su padre y su pareja. Si la beta se publicara ahí, dejaría de ser una beta. Así que la beta
# se publica como assets de una Release con la etiqueta fija `beta`, y la app —solo en los móviles
# con el canal beta activado en Ajustes → Dev → Pruebas— lee los manifiestos de esa release.
#
# Uso: push a la rama `beta` (o lanzarlo a mano desde Actions).
# Para promocionar una beta a producción: mergea esa rama a `main` como siempre.

on:
  push:
    branches: [beta]
  workflow_dispatch: {}

permissions:
  contents: write        # crear/actualizar la release `beta` y subir sus assets

concurrency:
  group: beta
  cancel-in-progress: false

jobs:
  beta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependencias
        run: npm ci

      # Una beta que no arranca no sirve de nada para probar. PERO no hace falta la suite
      # de 139 e2e para un commit de documentación: `relevant-tests` recorta por carpetas
      # (docs → sin Chromium; ingest → Deno; Gastos → sus specs). Si se toca el núcleo
      # (motor, i18n, shell, el runner) o un workflow, corre TODO. Promote y test.yml
      # de main NO usan esto — ahí la red de seguridad es la suite entera.
      - name: Plan de tests
        id: plan
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
          GITHUB_SHA: ${{ github.sha }}
        run: node scripts/relevant-tests.mjs --ci

      - uses: denoland/setup-deno@v2
        if: steps.plan.outputs.deno == 'true'
        with:
          deno-version: v2.x

      - name: Chromium (Playwright)
        if: steps.plan.outputs.playwright == 'true'
        run: |
          # El repo de Google Chrome sirve a veces un indice apt con el hash cambiado y tumba
          # `--with-deps` (9/9/2026: dos runs seguidos de la beta). No usamos Chrome, solo el
          # Chromium que trae Playwright, asi que se quita esa fuente antes de instalar. No se
          # relaja nada: los deps siguen instalandose con --with-deps.
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list || true
          npx playwright install chromium --with-deps

      - name: Tests
        run: node scripts/run-tests.mjs --plan relevant-plan.json

      # El número de la beta se calcula ANTES de sellar: el bundle tiene que llevar dentro
      # exactamente la misma versión que va a anunciar el manifiesto (ver más abajo).
      #
      # EL SUFIJO CUENTA COMPILACIONES DE ESTA VERSIÓN, NO RUNS DEL REPO (2026-07-28).
      # Antes era `${GITHUB_RUN_NUMBER}`, que es un contador GLOBAL del workflow y nunca se
      # reinicia: la 4.12.1 se anunciaba como «4.12.1.52» aunque fuera su primera compilación.
      # Su queja: «sale la versión 4.12.0.52, resetea ese 52 que no tiene sentido». Y tenía razón:
      # el 52 no dice nada de la beta que llevas puesta, solo cuántas veces se ha lanzado esto
      # desde que existe.
      #
      # El sufijo NO se puede quitar del todo, y conviene tenerlo escrito para no volver a
      # intentarlo: `_mcNewerVer` compara número a número, así que una beta que se llamara igual
      # que la estable (4.12.1 == 4.12.1) NO se vería como nueva y el móvil no la descargaría
      # jamás. Hace falta un número más, y lo que se arregla es de dónde sale.
      #
      # De dónde sale ahora: del título de la propia release `beta`, que ya dice cuál fue la
      # última («Beta 4.12.1.3»). Misma versión base → +1; versión base nueva → empieza en 1.
      # Sin estado que mantener en ningún sitio y se recompone solo si alguien borra la release.
      - name: Número de esta beta
        id: num
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BASE=$(cat VERSION | tr -d '[:space:]')
          PREV=$(gh release view beta --json name -q .name 2>/dev/null || echo "")
          # «Beta 4.12.1.3» → 4.12.1.3 ; cualquier otra cosa (release recién creada, título a
          # mano) cae al else y arranca de cero, que es lo correcto: no sabemos qué había.
          PREV_VER=$(printf '%s' "$PREV" | sed -n 's/^Beta \([0-9][0-9.]*\)$/\1/p')
          N=1
          if [ -n "$PREV_VER" ]; then
            PREV_BASE=$(printf '%s' "$PREV_VER" | cut -d. -f1-3)
            PREV_N=$(printf '%s' "$PREV_VER" | cut -d. -f4)
            if [ "$PREV_BASE" = "$BASE" ] && [ -n "$PREV_N" ]; then N=$((PREV_N + 1)); fi
          fi
          echo "anterior=«$PREV» · esta=$BASE.$N"
          echo "beta=$BASE.$N" >> "$GITHUB_OUTPUT"

      - name: Ensamblar y sellar
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          MC_STAMP_VERSION: ${{ steps.num.outputs.beta }}
        run: |
          node scripts/build-app.mjs
          node scripts/stamp-version.mjs
          npm install --no-save --no-audit --no-fund esbuild@0.25.5
          node scripts/minify-html.mjs

      # La versión de la beta lleva sufijo .N para que se distinga de un vistazo en Ajustes y para
      # que _mcNewerVer la vea como NUEVA respecto a la estable del mismo número.
      # ⚠ El sello del bundle (MC_STAMP_VERSION, arriba) y este manifiesto tienen que decir LO
      # MISMO. Cuando no lo decían, la app nunca alcanzaba la versión anunciada y ofrecía la misma
      # beta para siempre — «todo el maldito rato sale para actualizar» (2026-07-26).
      - name: Empaquetar bundle OTA de beta
        id: pack
        env:
          GH_TOKEN: ${{ github.token }}   # el resumen del «no ha cambiado» lee el título de la release
        run: |
          BETA="${{ steps.num.outputs.beta }}"

          # ¿HA CAMBIADO LA APP DE VERDAD? (2026-08-01)
          # Antes se publicaba en CADA push, así que un commit de documentación le subía el número
          # de beta y su móvil le avisaba de una actualización que no traía nada. Ese día se le
          # lanzaron OCHO, cinco en una hora, una de ellas un `docs(memoria)`: «me pide actualizar
          # todo el maldito rato». No se filtra por rutas —se olvida una carpeta y vuelve— sino
          # comparando EL RESULTADO: la huella del bundle compilado, con el sello normalizado
          # (`scripts/huella-bundle.mjs`). Si es la misma que la publicada, no hay nada que ofrecer
          # y esto termina sin tocar la release: el número NO se gasta, así que el siguiente cambio
          # de verdad se lleva el que tocaba y no quedan huecos.
          HUELLA=$(node scripts/huella-bundle.mjs)
          PREV_HUELLA=$(curl -sL "https://github.com/$GITHUB_REPOSITORY/releases/download/beta/version.json" \
            | sed -n 's/.*"src":"\([^"]*\)".*/\1/p')
          echo "huella de esta compilación: $HUELLA · publicada: «${PREV_HUELLA:-ninguna}»"
          if [ -n "$PREV_HUELLA" ] && [ "$HUELLA" = "$PREV_HUELLA" ]; then
            echo "publicar=no" >> "$GITHUB_OUTPUT"
            echo "### 🟰 La app no ha cambiado · beta NO republicada" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "El bundle compilado es idéntico al que ya está en el canal, así que su móvil no" >> $GITHUB_STEP_SUMMARY
            echo "recibe ningún aviso de actualización. Sigue publicada la **$(gh release view beta --json name -q .name)**." >> $GITHUB_STEP_SUMMARY
            exit 0
          fi
          echo "publicar=si" >> "$GITHUB_OUTPUT"

          (cd public && zip -qr ../bundle.zip .)
          printf '{"version":"%s","src":"%s","url":"https://github.com/%s/releases/download/beta/bundle.zip","channel":"beta"}\n' \
            "$BETA" "$HUELLA" "$GITHUB_REPOSITORY" > version.json
          # El manifiesto de la APK va TAMBIÉN al canal (2026-07-26). Antes solo se subían el bundle
          # y version.json, así que en un móvil en beta `mcFetchManifest("apk.json")` daba 404, caía
          # a producción y leía el número de PRODUCCIÓN. Efecto: con la 34 puesta y la 35 anunciada
          # en esta rama, la app comparaba 34 contra 34 y contestaba «estás a la última» — «al
          # intentarlo no pasa nada», sin un solo aviso. La beta anuncia ahora su propia APK.
          cp public/apk.json apk.json
          echo "beta=$BETA" >> "$GITHUB_OUTPUT"
          echo "BETA $BETA → $(du -h bundle.zip | cut -f1)"
          # Guardián: si el sello y el manifiesto se separan otra vez, la beta se queda ofreciéndose
          # en bucle en el móvil y sin poder saber cuál llevas. Mejor no publicarla.
          grep -q "APP_VERSION: *\"$BETA\"" public/index.html || {
            echo "::error::el bundle está sellado con otra versión que el manifiesto ($BETA)"; exit 1; }
          # Y que la APK que anuncia exista de verdad: ofrecer una descarga que da 404 se ve en el
          # móvil como «no pasa nada», igual de mudo que el fallo que arregla este commit.
          APK_URL=$(node -p 'require("./public/apk.json").url')
          APK_ST=$(curl -sL -o /dev/null -w '%{http_code}' "$APK_URL" || echo 000)
          if [ "$APK_ST" = "404" ]; then
            echo "::error::apk.json apunta a una release que no existe: $APK_URL"; exit 1
          fi
          echo "APK anunciada a la beta: $APK_URL (HTTP $APK_ST)"

      # Release fija `beta`: siempre la misma etiqueta y las mismas URLs de descarga, así la app no
      # tiene que descubrir nada. Marcada como prerelease para que no salga como «última versión».
      - name: Publicar en la release `beta`
        if: steps.pack.outputs.publicar == 'si'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view beta >/dev/null 2>&1; then
            gh release create beta --prerelease --title "Beta (canal de pruebas)" \
              --notes "Canal de pruebas del dueño. Se activa en Ajustes → Dev → Pruebas. No es la versión publicada para el resto."
          fi
          gh release upload beta bundle.zip version.json apk.json --clobber
          gh release edit beta --title "Beta ${{ steps.pack.outputs.beta }}"

      - name: Resumen
        if: steps.pack.outputs.publicar == 'si'
        run: |
          echo "### 🚧 Beta publicada: ${{ steps.pack.outputs.beta }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Llega SOLO a los móviles con el canal beta activado (Ajustes → Dev → Pruebas)." >> $GITHUB_STEP_SUMMARY
          echo "La estable de GitHub Pages no se ha tocado." >> $GITHUB_STEP_SUMMARY
